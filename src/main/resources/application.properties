spring.application.name=postbox

# Document only the public notification API (not Actuator endpoints).
springdoc.paths-to-match=/v1/notifications,/v1/notifications/**

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5433/postbox
spring.datasource.username=postbox
spring.datasource.password=${POSTGRES_PASSWORD}

# JPA
spring.jpa.hibernate.ddl-auto=validate

# RabbitMQ
spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=postbox
spring.rabbitmq.password=${RABBITMQ_PASSWORD}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.listener.simple.default-requeue-rejected=false

# Service credentials are comma-separated clientId=SHA-256-of-bearer-token pairs.
postbox.clients=${POSTBOX_CLIENTS:}
postbox.expo.endpoint=${EXPO_ENDPOINT:https://exp.host/--/api/v2/push}
postbox.expo.access-token=${EXPO_ACCESS_TOKEN:}
postbox.push.encryption-key=${POSTBOX_PUSH_ENCRYPTION_KEY:}

# Actuator
management.endpoints.web.exposure.include=health,info,metrics

# Flyway
spring.flyway.enabled=true
