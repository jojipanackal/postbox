name: postbox

services:
  app:
    image: ghcr.io/jojipanackal/postbox:latest
    restart: unless-stopped
    # The existing postgres and standalone rabbitmq containers must be on apps.
    ports:
      - "127.0.0.1:${POSTBOX_PORT:-8081}:8080"
    networks:
      - apps
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/postbox
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_VIRTUAL_HOST: postbox
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?Set RABBITMQ_PASSWORD in .env}
      POSTBOX_CLIENTS: ${POSTBOX_CLIENTS:?Set POSTBOX_CLIENTS in .env}
      POSTBOX_PUSH_ENCRYPTION_KEY: ${POSTBOX_PUSH_ENCRYPTION_KEY:?Set POSTBOX_PUSH_ENCRYPTION_KEY in .env}
      EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}

networks:
  apps:
    external: true
